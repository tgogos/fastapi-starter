[project]
name = "fastapi-starter"
version = "0.1.0"
description = "FastAPI + HTMX boilerplate with SQLite auth and a JSON API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.122.0",
    "starlette==0.50.0",
    "pydantic-settings==2.5.0",
    "motor==3.3.2",
    "pymongo==4.6.0",
    "aiosqlite==0.20.0",
    "bcrypt==4.2.1",
    "itsdangerous==2.2.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.2",
    "httpx==0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
