<tr id="item-row-{{ item.id }}">
  <td colspan="4">
    <form
      class="edit-form"
      hx-put="/ui/items/{{ item.id }}"
      hx-target="#item-row-{{ item.id }}"
      hx-swap="outerHTML"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="grid">
        <label>
          Name
          <input type="text" name="name" value="{{ item.name }}" required maxlength="100">
        </label>
        <label>
          Description
          <input type="text" name="description" value="{{ item.description or '' }}" maxlength="500">
        </label>
      </div>
      <div class="actions">
        <button type="submit">Save</button>
        <button
          type="button"
          class="outline"
          hx-get="/ui/items/{{ item.id }}/row"
          hx-target="#item-row-{{ item.id }}"
          hx-swap="outerHTML"
        >Cancel</button>
      </div>
    </form>
  </td>
</tr>
