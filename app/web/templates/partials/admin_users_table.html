{% if form_error %}
<p class="flash flash-error" role="alert">{{ form_error }} <button type="button" class="flash-dismiss" aria-label="Dismiss">×</button></p>
{% endif %}
{% if form_ok %}
<p class="flash flash-ok" role="status">{{ form_ok }} <button type="button" class="flash-dismiss" aria-label="Dismiss">×</button></p>
{% endif %}

<figure>
  <table>
    <thead>
      <tr>
        <th scope="col">Username</th>
        <th scope="col">Role</th>
        <th scope="col">Change role</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}{% if u.id == user.id %} <small>(you)</small>{% endif %}</td>
        <td><code>{{ u.role }}</code></td>
        <td>
          <form
            class="inline-form role-form"
            hx-post="/ui/admin/users/{{ u.id }}/role"
            hx-target="#admin-users-panel"
            hx-swap="innerHTML"
          >
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <select name="role" aria-label="Role for {{ u.username }}">
              {% for r in roles %}
              <option value="{{ r }}" {% if r == u.role %}selected{% endif %}>{{ r }}</option>
              {% endfor %}
            </select>
            <button type="submit" class="outline">Save</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
