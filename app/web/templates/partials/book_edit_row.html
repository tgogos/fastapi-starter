<tr id="book-row-{{ book.id }}">
  <td colspan="{% if can_edit %}8{% else %}7{% endif %}">
    <form
      class="edit-form"
      hx-put="/ui/books/{{ book.id }}"
      hx-target="#book-row-{{ book.id }}"
      hx-swap="outerHTML"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="grid">
        <label>
          Title
          <input type="text" name="title" value="{{ book.title }}" required maxlength="200">
        </label>
        <label>
          Author
          <input type="text" name="author" value="{{ book.author }}" required maxlength="200">
        </label>
      </div>
      <div class="grid">
        <label>
          Category
          <select name="category">
            {% for c in categories %}
            <option value="{{ c }}" {% if book.category == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Year
          <input type="number" name="year" value="{{ book.year if book.year is not none else '' }}" min="0" max="9999">
        </label>
        <label>
          Pages
          <input type="number" name="page_count" value="{{ book.page_count if book.page_count is not none else '' }}" min="1" max="100000">
        </label>
      </div>
      <div class="grid">
        <label>
          ISBN
          <input type="text" name="isbn" value="{{ book.isbn or '' }}" maxlength="32">
        </label>
        <label>
          Notes
          <input type="text" name="notes" value="{{ book.notes or '' }}" maxlength="2000">
        </label>
      </div>
      <label>
        <input type="checkbox" name="available" value="1" {% if book.available %}checked{% endif %}>
        Available
      </label>
      <div class="actions">
        <button type="submit">Save</button>
        <button
          type="button"
          class="outline"
          hx-get="/ui/books/{{ book.id }}/row"
          hx-target="#book-row-{{ book.id }}"
          hx-swap="outerHTML"
        >Cancel</button>
      </div>
    </form>
  </td>
</tr>
