{% extends "base.html" %}
{% block title %}Books · FastAPI HTMX Starter{% endblock %}
{% block content %}
<h1>Books</h1>
<p>
  HTMX UI backed by SQLite.
  <a href="/ui/books/search">Advanced search</a> for filters.
</p>

{% if can_edit %}
<article>
  <h2>Add book</h2>
  <form
    hx-post="/ui/books"
    hx-target="#books-panel"
    hx-swap="innerHTML"
    hx-indicator="#books-indicator"
  >
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="grid">
      <label>
        Title
        <input type="text" name="title" required maxlength="200">
      </label>
      <label>
        Author
        <input type="text" name="author" required maxlength="200">
      </label>
    </div>
    <div class="grid">
      <label>
        Category
        <select name="category">
          {% for value, label in categories %}
          <option value="{{ value }}" {% if value == 'fiction' %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Year
        <input type="number" name="year" min="0" max="9999">
      </label>
      <label>
        Pages
        <input type="number" name="page_count" min="1" max="100000">
      </label>
    </div>
    <div class="grid">
      <label>
        ISBN
        <input type="text" name="isbn" maxlength="32">
      </label>
      <label>
        Notes
        <input type="text" name="notes" maxlength="2000">
      </label>
    </div>
    <label>
      <input type="checkbox" name="available" value="1" checked>
      Available
    </label>
    <button type="submit">Create</button>
  </form>
</article>
{% endif %}

<div class="search-toolbar">
  <form
    class="search-form"
    method="get"
    action="/ui/books"
    hx-get="/ui/books"
    hx-target="#books-panel"
    hx-swap="innerHTML"
    hx-trigger="keyup changed delay:300ms from:input[name='q'], search from:input[name='q']"
    hx-push-url="true"
    hx-indicator="#books-indicator"
  >
    <input type="hidden" name="page" value="1">
    <input type="hidden" name="size" value="{{ size }}">
    <label>
      Search
      <input
        type="search"
        name="q"
        value="{{ q }}"
        placeholder="Title, author, or ISBN"
        aria-label="Search books"
        autocomplete="off"
      >
    </label>
    <noscript><button type="submit">Search</button></noscript>
  </form>

  <div
    id="books-indicator"
    class="htmx-indicator"
    role="status"
    aria-live="polite"
    aria-label="Loading"
  >
    <span class="spinner" aria-hidden="true"></span>
  </div>
</div>

<div id="books-panel">
  {% include "partials/books_table.html" %}
</div>
{% endblock %}
