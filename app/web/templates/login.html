{% extends "base.html" %}
{% block title %}Log in · FastAPI HTMX Starter{% endblock %}
{% block content %}
<article>
  <h1>Log in</h1>
  <p>Use the demo user from <code>DEMO_USERNAME</code> / <code>DEMO_PASSWORD</code> (default <code>admin</code> / <code>admin123</code>).</p>

  {% if error %}
  <p class="flash flash-error" role="alert">{{ error }} <button type="button" class="flash-dismiss" aria-label="Dismiss">×</button></p>
  {% endif %}

  <form method="post" action="/auth/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      Username
      <input type="text" name="username" autocomplete="username" required>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
</article>
{% endblock %}
